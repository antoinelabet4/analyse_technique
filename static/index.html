<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Analyse technique crypto</title>
  <link rel="stylesheet" href="/static/style.css" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0e14" />

  <!-- Safari iOS n'utilise pas pleinement le manifest : ces balises sont
       ce qui compte réellement pour "Ajouter à l'écran d'accueil". -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Analyse crypto" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" href="/static/icons/icon-192.png" />
</head>
<body>
  <header>
    <h1>Analyse technique crypto</h1>
    <span id="source-badge">Chargement…</span>
  </header>

  <div class="selecteurs">
    <select id="selecteur-actif" aria-label="Choisir un actif"></select>
    <div class="timeframe">
      <button data-timeframe="1d" class="actif">1D</button>
      <button data-timeframe="1w">1W</button>
    </div>
  </div>

  <div class="selecteurs selecteurs-secondaires">
    <details id="menu-indicateurs" class="menu-indicateurs">
      <summary>Indicateurs</summary>
      <div class="menu-indicateurs-panneau">
        <label><input type="checkbox" data-indicateur="mm" checked /> Moyennes mobiles</label>
        <label><input type="checkbox" data-indicateur="nuage" checked /> Nuage Ichimoku</label>
        <label><input type="checkbox" data-indicateur="zones" checked /> Zones support/résistance</label>
        <label><input type="checkbox" data-indicateur="rsi" checked /> RSI (14)</label>
        <label><input type="checkbox" data-indicateur="macd" checked /> MACD (12/26/9)</label>
      </div>
    </details>
    <button id="bouton-plein-ecran" class="bouton-secondaire" aria-label="Agrandir le graphique">⤢ Agrandir</button>
  </div>

  <div class="legende-zones">
    <span><span class="pastille pastille-opportunite"></span>Opportunité</span>
    <span><span class="pastille pastille-risque"></span>Risque</span>
    <span><span class="pastille pastille-nuage"></span>Nuage Ichimoku</span>
  </div>

  <div id="chart-wrapper">
    <button id="bouton-fermer-plein-ecran" class="bouton-fermer-plein-ecran" aria-label="Quitter le plein écran">✕</button>
    <div id="chart"></div>
    <svg id="nuage-svg"></svg>
    <div id="chart-overlay"></div>
  </div>

  <div class="periode-affichee" id="periode-affichee">
    <button data-periode="1m">1M</button>
    <button data-periode="3m">3M</button>
    <button data-periode="6m">6M</button>
    <button data-periode="ytd">YTD</button>
    <button data-periode="1y">1Y</button>
    <button data-periode="tout" class="actif">Tout</button>
  </div>

  <button id="bouton-analyse" class="bouton-analyse">Lancer l'analyse</button>

  <div id="analyse-llm"></div>
  <div id="resume"></div>

  <footer>
    Analyse générée automatiquement par IA, à usage strictement personnel. Les verdicts peuvent se tromper, à vérifier par soi-même avant toute décision.
  </footer>
  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
